<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reza — rezakj</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1c1917;
      --muted: #57534e;
      --paper: #f7f4ef;
      --line: #d6d0c6;
      --accent: #0f5c4c;
      --accent-hover: #0a4036;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, rgba(15, 92, 76, 0.08), transparent 55%),
        linear-gradient(180deg, #faf8f4 0%, var(--paper) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    main {
      width: min(34rem, 100%);
    }
    p.kicker {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    h1 {
      font-family: "Source Serif 4", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2rem, 5vw, 2.6rem);
      line-height: 1.15;
      margin-bottom: 0.75rem;
    }
    .lede {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
      margin-bottom: 1.75rem;
      max-width: 28rem;
    }
    a.cta {
      display: inline-block;
      color: #fff;
      background: var(--accent);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 0.7rem 1.15rem;
      border-radius: 4px;
      transition: background 0.15s ease;
    }
    a.cta:hover,
    a.cta:focus-visible {
      background: var(--accent-hover);
    }
    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--muted);
    }
    footer a {
      color: var(--accent);
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">rezakj.github.io</p>
    <h1>Reza</h1>
    <p class="lede">Personal Pages placeholder. Site root is live; project pages live under their own paths.</p>
    <a class="cta" href="/iCellR2/">iCell Suite dashboard →</a>
    <footer>
      GitHub: <a href="https://github.com/rezakj">github.com/rezakj</a>
    </footer>
  </main>
</body>
</html>
